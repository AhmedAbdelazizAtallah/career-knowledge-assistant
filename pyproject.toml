[project]
name = "nrag"
version = "1.0.0"
description = "Local RAG career-knowledge assistant (PDF ingestion -> Chroma -> Ollama)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
