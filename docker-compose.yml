services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NRAG_OLLAMA_HOST=http://ollama:11434
      - NRAG_CHROMA_DIR=/app/chroma_db
      - NRAG_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    depends_on:
      - ollama

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - NRAG_API_BASE_URL=http://api:8000
    depends_on:
      - api

volumes:
  ollama_data:
